[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "human-feedback-rl"
version = "0.2.0"
description = "Human-feedback RL algorithms (preference-based, demonstration-based, DAgger) for SUMO driving"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "scipy>=1.10",
    "wandb>=0.16",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["human_feedback_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
