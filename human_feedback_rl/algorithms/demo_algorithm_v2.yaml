defaults:
  - agent: ppo   # override on the CLI: agent=sac
  - _self_

run:
  seed: 0
  output_dir: outputs/demo_algorithm_v2

wandb:
  entity: andrea02polimi-politecnico-di-milano
  project: PPO_demo
  tags: Null

env:
  id: "HighwayEgo-v0"
  n_envs: 4
  kwargs:
    ego: "continuous"
    reward: "fast"

algo:
  kwargs:
    lr_rew: 0.001
    gradient_steps_rew: 100
    batch_size_expert: 32
    batch_size_model: 64
    reward_model_kwargs:
      net_arch: [32, 32]
      activation_fn: tanh

train:
  kwargs:
    total_timesteps: 2000000
    timesteps_per_iteration: 20000
    checkpoint_interval: 10

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
