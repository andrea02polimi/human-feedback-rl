# @package agent
type: "SAC"
kwargs:
  policy: "MlpPolicy"
  learning_rate: 0.0003      # ok, default SAC
  buffer_size: 100000        
  learning_starts: 2000      # ok (conta solo all'inizio: num_timesteps cumulativo)
  batch_size: 256            # ok
  tau: 0.005                 # ok
  gamma: 0.997               
  train_freq: 64             # batched per la CPU
  gradient_steps: 64         # = train_freq → UTD ≈ 1
  ent_coef: "auto"           # ok, fondamentale per esplorazione continua
  policy_kwargs:
    net_arch: [64, 64]       # ok per 16-dim obs
  device: "cpu"
