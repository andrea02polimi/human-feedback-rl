# @package _global_
# Config 4: Christiano et al. with environment reward oracle + demo preferences.
# Expert-correction segments enter PrefDB directly as labeled preferences
# (1.0, 0.0), always preferring expert over agent. No DemoDatabase, no margin
# ranking loss — only the standard Christiano MLE preference loss.
# Two parallel workers feed preference_pipe in Phase 1 and Phase 3:
#   - preference_worker  : oracle labels (env_reward, soft or hard)
#   - demo_pref_worker   : automatic labels (1.0, 0.0)
# DB sizes are doubled to accommodate both preference streams.
preferences:
  oracle: "qnet"
  label_mode: "soft"
  use_demonstrations: false      # margin loss path disabled
  use_demo_preferences: true     # demo-as-preferences path enabled
  initial_prefs: 1000
  segment_len: 25
  max_segs: 1000
  db_train_maxlen: 6000          # doubled: two preference sources
  db_val_maxlen: 1500            # doubled
  seg_pipe_maxsize: 100
  demo_seg_pipe_maxsize: 100
  disagreement_candidates: 20
  max_query_interval: 5.0
