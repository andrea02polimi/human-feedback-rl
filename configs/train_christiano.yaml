seed: 0

env:
  expert_model: "highway_discrete_dqn_v2_1"   # folder at repo root
  scenario: "highway_discrete_v2"              # used by eval.py / play.py

resources:
  device: cpu

# ── Reward predictor ensemble (Christiano et al.) ────────────────────────────
reward_predictor:
  lr: 2e-4
  n_preds: 3          # ensemble size (paper uses 3)
  val_interval: 50    # reward predictor training steps between validation logs
  retrain_interval: 50  # retrain RP after every k new labeled preferences arrive

# ── Preferences ───────────────────────────────────────────────────────────────
preferences:
  oracle: "expert"        # "expert" → DQN synthetic | "human" → terminal L/R/E/S
  initial_prefs: 500      # labeled pairs collected before pretraining (paper: 500)
  segment_len: 25         # steps per trajectory segment (paper default)
  max_segs: 1000          # max segments kept in preference-worker buffer
  db_train_maxlen: 3000   # max labeled pairs in training database
  db_val_maxlen: 750      # max labeled pairs in validation database (~20%)
  seg_pipe_maxsize: 100   # individual segments buffered between processes
  disagreement_candidates: 20   # candidate pairs evaluated per disagreement selection
  query_annealing_rate: 0.002   # seconds added per label after the initial burst
  max_query_interval: 5.0       # cap on inter-query sleep (seconds)

# ── Policy (A2C — algorithm used in the paper) ────────────────────────────────
policy:
  lr: 7e-4              # A2C learning rate
  gamma: 0.99           # discount factor
  rollout_steps: 20     # environment steps collected per A2C update
  entropy_coef: 0.01    # entropy bonus (encourages exploration)
  value_coef: 0.5       # weight of the critic loss
  max_gradient_norm: 0.5

# ── Training loop ─────────────────────────────────────────────────────────────
training:
  # The reward predictor trains continuously in the background until the policy
  # reaches total_env_steps (no fixed iteration cap — mirrors the paper).

  # How often the policy worker reloads the latest reward predictor checkpoint
  # (in A2C gradient steps).
  reward_predictor_reload_interval: 50

  # Save a policy checkpoint to disk every N A2C gradient steps.
  policy_save_interval: 100

  # Primary stop condition: total environment steps across all parallel envs.
  # 4 envs × 20 rollout_steps × 10 000 gradient steps = 800 000 env steps.
  # Set to 0 for unlimited (Ctrl+C to stop).
  total_env_steps: 800000

hydra:
  run:
    dir: experiments/christiano/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: config
