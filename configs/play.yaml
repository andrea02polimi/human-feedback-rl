run:
  # Path to the training run directory (relative to human-feedback-rl/)
  dir: "experiments/christiano/2026-03-15/23-29-04"

agent:
  # Path to the policy checkpoint (relative to human-feedback-rl/)
  model: "experiments/christiano/2026-03-15/23-29-04/models/policy_christiano.pt"

eval:
  episodes: null          # null = run forever until Ctrl+C

play:
  step_delay: 0.05         # seconds between steps (0 = as fast as possible)
  interactive: false      # true = press Enter before each step

hydra:
  run:
    dir: experiments/play/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: config
